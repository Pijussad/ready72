name: ready72
description: "Ready72 — a personal 72-hour emergency bag plan for every person in a household."
publish_to: 'none'
version: 1.5.1+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0
  url_launcher: ^6.3.3
  intl: 0.20.2
  clock: ^1.1.2
  pdf: ^3.11.3
  printing: ^5.14.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  image: 4.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
